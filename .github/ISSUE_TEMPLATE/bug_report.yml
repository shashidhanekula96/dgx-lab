name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API tokens, private endpoint URLs, or hostnames you don't want public.**
        Security issues → use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and the error output (run with DGX_LAB_DEBUG=1 for a traceback).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [vLLM, SGLang, Ollama, LM Studio, llama.cpp, Remote gateway / hosted API, Other, N/A]
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Environment
      description: "`dgxlab --version` and `dgxlab check-host` output (redact the hostname if you like)."
      render: text
    validations:
      required: true
