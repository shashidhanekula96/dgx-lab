name: Publish to PyPI

# Publishes an existing release tag to PyPI using Trusted Publishing (OIDC) — no API
# token is stored in the repo. Runs automatically at the end of the Release workflow,
# or manually: Actions → Publish to PyPI → Run workflow → enter the tag (e.g. v0.2.0).
#
# One-time setup on pypi.org (Account → Publishing → Add a pending publisher):
#   owner: shashidhanekula96 · repository: dgx-lab · workflow: publish-pypi.yml · environment: pypi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          # Plain semver tag only (also blocks shell injection).
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]*)?$ ]]; then
            echo "Invalid tag: $TAG" >&2; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          project_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          if [[ "v$project_version" != "$TAG" ]]; then
            echo "pyproject.toml version is $project_version, tag is $TAG" >&2; exit 1
          fi

      - name: Test
        run: |
          uv sync --frozen --group dev
          uv run pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dgx-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
