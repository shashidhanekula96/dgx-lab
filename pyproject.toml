[project]
name = "dgx-lab"
version = "0.1.0"
description = "Multi-OS config-as-code comparison lab for OpenAI-compatible LLM runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Shashikanth Dhanekula" },
]
keywords = ["llm", "vllm", "evaluation", "dgx", "lab", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
dgxlab = "dgx_lab.cli:main"

[project.urls]
Homepage = "https://github.com/shashidhanekula96/dgx-lab"
Issues = "https://github.com/shashidhanekula96/dgx-lab/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgx_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
