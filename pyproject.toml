[project]
name = "dgx-lab"
version = "0.2.0"
description = "Config-as-code eval harness for OpenAI-compatible LLM endpoints (vLLM, Ollama, LM Studio, gateways)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Shashikanth Dhanekula" },
]
keywords = ["llm", "vllm", "ollama", "evaluation", "benchmark", "dgx", "openai-compatible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
dgxlab = "dgx_lab.cli:main"

[project.urls]
Homepage = "https://github.com/shashidhanekula96/dgx-lab"
Issues = "https://github.com/shashidhanekula96/dgx-lab/issues"
Changelog = "https://github.com/shashidhanekula96/dgx-lab/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgx_lab"]

# Ship default golden set, KPI gates and a starter experiment inside the wheel so
# `pip install` / `uvx` users get working defaults without cloning the repo.
[tool.hatch.build.targets.wheel.force-include]
"evals/golden/smoke.jsonl" = "dgx_lab/_data/smoke.jsonl"
"configs/kpis/default.yaml" = "dgx_lab/_data/kpis-default.yaml"
"configs/experiments/local-example.yaml" = "dgx_lab/_data/experiment-example.yaml"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "evals", "deployments", "scripts", "docs", "*.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
