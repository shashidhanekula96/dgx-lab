# Qwen3-8B via digest-pinned vLLM — loopback publish, token-gated.
# Set VLLM_IMAGE to a digest pin: vllm/vllm-openai@sha256:<64hex>
# Set DGX_LAB_API_TOKEN before `docker compose up`.
# Optional: COMPOSE_PLATFORM (e.g. linux/arm64 or linux/amd64) when the image is single-arch.

services:
  vllm:
    image: ${VLLM_IMAGE}
    # Platform is not hardcoded. For a single-arch image, set e.g.:
    #   export COMPOSE_DOCKER_CLI_BUILD=1
    #   docker compose -f ... up --pull always
    # or add a compose override with `platform: linux/arm64` on Spark.
    container_name: dgx-lab-qwen3-8b-vllm
    ipc: host
    restart: "no"
    ports:
      - "${SERVE_BIND_HOST:-127.0.0.1}:${SERVE_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${DGX_LAB_API_TOKEN}
    volumes:
      - ${MODEL_DIR:-${HOME}/dgx-lab/models/qwen3-8b}:/models/qwen3-8b:ro
      - ${DGX_LAB_ROOT:-${HOME}/dgx-lab}/logs/vllm:/var/log/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - /models/qwen3-8b
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3-8b}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --api-key
      - ${DGX_LAB_API_TOKEN}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.75}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --trust-remote-code
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "curl -fsS -H \"Authorization: Bearer $$VLLM_API_KEY\" http://127.0.0.1:8000/v1/models || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
